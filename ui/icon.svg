<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1e24"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="111.25" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- top light sweep -->
  <path d="M0 112C0 50 50 0 112 0h288c62 0 112 50 112 112v36c-96-34-192-50-512-6V112z" fill="#ffffff" fill-opacity="0.035"/>

  <g>
    <rect x="108" y="108" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="184" y="108" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="260" y="108" width="56" height="56" rx="16" fill="url(#hot)" filter="url(#glow)"/>
    <rect x="336" y="108" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>

    <rect x="108" y="184" width="56" height="56" rx="16" fill="url(#hot)" filter="url(#glow)"/>
    <rect x="184" y="184" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="260" y="184" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="336" y="184" width="56" height="56" rx="16" fill="url(#hot)" filter="url(#glow)"/>

    <rect x="108" y="260" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="184" y="260" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="260" y="260" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="336" y="260" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>

    <rect x="108" y="336" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="184" y="336" width="56" height="56" rx="16" fill="url(#hot)" filter="url(#glow)"/>
    <rect x="260" y="336" width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="336" y="336" width="56" height="56" rx="16" fill="url(#hot)" filter="url(#glow)"/>
  </g>
</svg>
